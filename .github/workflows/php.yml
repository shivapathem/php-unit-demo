
name: PHP CI Pipeline

run-name: CI for ${{ github.ref_name }}

###############################################################################
# Triggers
###############################################################################
on:
  push:
    branches:
      - dev
      - qa
  pull_request:
    branches:
      - qa
  workflow_dispatch:

###############################################################################
# Jobs
###############################################################################
jobs:
  test:
    name: PHP CI + SonarQube
    runs-on:
      - self-hosted
      - Windows

    steps:
      #########################################################################
      # Step 1: Checkout
      #########################################################################
      - name: Checkout Code
        uses: actions/checkout@v4

      #########################################################################
      # Step 2: Print branch
      #########################################################################
      - name: Print Branch
        shell: cmd
        run: echo Running on branch %GITHUB_REF_NAME%

      #########################################################################
      # Step 3: Setup PHP
      #########################################################################
      - name: Setup PHP with Xdebug
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: xdebug
          tools: composer

      #########################################################################
      # Step 4: Install dependencies
      #########################################################################
      - name: Install Dependencies
        shell: cmd
        run: composer install --no-progress --prefer-dist --no-interaction

      #########################################################################
      # Step 5: Run PHPUnit
      #########################################################################
      - name: Run Tests with Coverage
        shell: cmd
        run: >
          vendor\bin\phpunit
          --log-junit junit.xml
          --coverage-clover coverage.xml
          --coverage-html coverage

      #########################################################################
      # Step 6: Download SonarScanner (WINDOWS SAFE)
      #########################################################################
      - name: Download SonarScanner
        shell: powershell
        run: |
          $url = "https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-5.0.1.3006-windows.zip"
          Invoke-WebRequest $url -OutFile sonar.zip
          Expand-Archive sonar.zip sonar-scanner

      #########################################################################
      # Step 7: Run SonarQube Scan
      #########################################################################
      - name: SonarQube Scan
        shell: cmd
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          sonar-scanner\sonar-scanner-5.0.1.3006-windows\bin\sonar-scanner.bat
          -Dsonar.projectKey=php-demo
          -Dsonar.projectName=PHP Demo
          -Dsonar.sources=src
          -Dsonar.tests=tests
          -Dsonar.exclusions=vendor/**
          -Dsonar.php.coverage.reportPaths=coverage.xml
          -Dsonar.php.tests.reportPath=junit.xml
          -Dsonar.host.url=%SONAR_HOST_URL%
          -Dsonar.login=%SONAR_TOKEN%

      #########################################################################
      # Step 8: Upload reports
      #########################################################################
      - name: Upload JUnit Report
        uses: actions/upload-artifact@v4
        with:
          name: junit-report-${{ github.ref_name }}
          path: junit.xml

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ github.ref_name }}
          path: coverage

      #########################################################################
      # Step 9: Done
      #########################################################################
      - name: Pipeline Done
        shell: cmd
        run: echo ✅ PHP CI + SonarQube completed successfully
``
