
name: PHP CI Pipeline

run-name: CI for ${{ github.ref_name }}

################################################################################
# Triggers
################################################################################
on:
  push:
    branches:
      - dev
      - qa
  pull_request:
    branches:
      - qa
  workflow_dispatch:

################################################################################
# Jobs
################################################################################
jobs:
  test:
    name: PHP CI + SonarQube
    runs-on:
      - self-hosted
      - Windows

     timeout-minutes: 30

    steps:
      ##########################################################################
      # 1. Checkout source
      ##########################################################################
      - name: Checkout Code
        uses: actions/checkout@v4

      ##########################################################################
      # 2. Print branch name
      ##########################################################################
      - name: Print Branch
        shell: cmd
        run: echo Running on branch %GITHUB_REF_NAME%

      ##########################################################################
      # 3. Setup PHP
      ##########################################################################
      - name: Setup PHP with Xdebug
        uses: shivammathur/setup-php@v2
        
        with:
          php-version: '8.1'
          coverage: xdebug
          tools: composer

      ##########################################################################
      # 4. Install dependencies
      ##########################################################################
      - name: Install Dependencies
        shell: cmd
        run: composer install --no-interaction --prefer-dist --no-progress

      ##########################################################################
      # 5. Run PHPUnit with coverage
      ##########################################################################
      - name: Run Tests with Coverage
        shell: cmd
        run: >
          vendor\bin\phpunit
          --log-junit junit.xml
          --coverage-clover coverage.xml
          --coverage-html coverage

      ##########################################################################
      # 6. SonarQube Scan (Windows / CLI-based)
      ##########################################################################
      - name: SonarQube Scan
        shell: cmd
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          sonar-scanner.bat
          -Dsonar.projectKey=php-demo
          -Dsonar.projectName="PHP Demo"
          -Dsonar.sources=src
          -Dsonar.tests=tests
          -Dsonar.exclusions=vendor/**
          -Dsonar.php.coverage.reportPaths=coverage.xml
          -Dsonar.php.tests.reportPath=junit.xml
          -Dsonar.host.url=%SONAR_HOST_URL%
          -Dsonar.login=%SONAR_TOKEN%

      ##########################################################################
      # 7. Upload test & coverage artifacts
      ##########################################################################
      - name: Upload JUnit Report
        uses: actions/upload-artifact@v4
        with:
          name: junit-report-${{ github.ref_name }}
          path: junit.xml

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ github.ref_name }}
          path: coverage

      ##########################################################################
      # 8. Completion message
      ##########################################################################
      - name: Pipeline Completed
        shell: cmd
        run: echo ✅ PHP CI + SonarQube pipeline completed successfully
