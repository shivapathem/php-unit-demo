name: PHP CI Pipeline with Coverage Report
 
on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "main" ]
 
jobs:
  test:
    runs-on: ubuntu-latest
 
    steps:
    # Step 1: Checkout code
    - name: Checkout Code
      uses: actions/checkout@v4
 
    # Step 2: Setup PHP with Xdebug (REQUIRED for coverage)
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.1'
        coverage: xdebug
 
    # Step 3: Install dependencies
    - name: Install Dependencies
      run: composer install --no-progress --prefer-dist
 
    # Step 4: Run tests + generate reports
    - name: Run Tests with Coverage
      run: |
        vendor/bin/phpunit --log-junit junit.xml --coverage-html coverage
 
    # 🔍 Step 5: Debug (VERY IMPORTANT)
    - name: Check generated files
      run: ls -la
 
    # Step 6: Upload JUnit report
    - name: Upload JUnit Report
      uses: actions/upload-artifact@v4
      with:
        name: junit-report
        path: junit.xml
 
    # Step 7: Upload HTML Coverage Report
    - name: Upload Coverage Report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage
