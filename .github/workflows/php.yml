
name: PHP CI with SonarQube

################################################################################
# Triggers
################################################################################
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

################################################################################
# Permissions
################################################################################
permissions:
  contents: read
  pull-requests: read

################################################################################
# Concurrency
################################################################################
concurrency:
  group: php-ci-${{ github.ref }}
  cancel-in-progress: true

################################################################################
# Jobs
################################################################################
jobs:
  php-ci:
    name: PHP Build, Test & SonarQube
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      ##########################################################################
      # Checkout
      ##########################################################################
      - name: Checkout repository
        uses: actions/checkout@v4

      ##########################################################################
      # PHP Setup
      ##########################################################################
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, pdo, pdo_mysql
          coverage: xdebug
          tools: composer

      ##########################################################################
      # Verify Tools
      ##########################################################################
      - name: Verify PHP & Composer
        run: |
          php -v
          composer --version

      ##########################################################################
      # Cache dependencies
      ##########################################################################
      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: |
            vendor
            ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      ##########################################################################
      # Install dependencies
      ##########################################################################
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      ##########################################################################
      # PHPUnit
      ##########################################################################
      - name: Run PHPUnit with coverage
        run: |
          if [ -f vendor/bin/phpunit ]; then
            vendor/bin/phpunit --coverage-clover coverage.xml
          else
            echo "PHPUnit not configured, skipping"
          fi

      ##########################################################################
      # SonarQube Scan ✅
      ##########################################################################
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=php-project
            -Dsonar.projectName=PHP Project
            -Dsonar.sources=.
            -Dsonar.exclusions=vendor/**
            -Dsonar.php.coverage.reportPaths=coverage.xml

      ##########################################################################
      # Status
      ##########################################################################
      - name: Pipeline status
        run: echo "✅ PHP CI + SonarQube analysis completed"
