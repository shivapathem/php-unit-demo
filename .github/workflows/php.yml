name: PHP CI (Windows Self-Hosted)
 
on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]
 
jobs:
  test:
    runs-on: self-hosted   # ✅ your Windows runner
 
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
 
      # ⚠️ OPTIONAL: Use only if setup-php works in your machine
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: xdebug
 
      # ✅ Verify PHP (very important for debugging)
      - name: Check PHP version
        run: php -v
 
      - name: Check Composer
        run: composer -v
 
      - name: Install dependencies
        run: composer install
 
      # ✅ FIXED: No '^', Windows-compatible command
      - name: Run Tests with Coverage
        run: vendor\bin\phpunit --coverage-clover coverage.xml --log-junit junit.xml
 
      - name: Upload JUnit Report
        uses: actions/upload-artifact@v3
        with:
          name: junit-report
          path: junit.xml
 
      - name: Upload Coverage Report
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: coverage.xml
